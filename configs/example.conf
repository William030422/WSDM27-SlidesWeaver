# Public configuration template. Copy to local.conf and edit your own settings.
# Key/value syntax; no shell variable expansion. Existing private configs are
# never copied into this distribution. Export APIMART_API_KEY in your shell.
APIMART_API_ROOT=https://api.apimart.ai/v1
APIMART_CHAT_MODEL=YOUR_CHAT_AND_VISION_MODEL
APIMART_IMAGE_MODEL=YOUR_IMAGE_MODEL
APIMART_IMAGE_SIZE=1536x864
APIMART_IMAGE_RESOLUTION=1K
APIMART_IMAGE_QUALITY=medium
APIMART_IMAGE_MAX_ATTEMPTS=2
APIMART_CHAT_MAX_TOKENS=16000
APIMART_VLM_MAX_TOKENS=16000
APIMART_TIMEOUT_SECONDS=240
APIMART_POLL_INITIAL_DELAY_SECONDS=5
APIMART_POLL_INTERVAL_SECONDS=5
APIMART_POLL_TIMEOUT_SECONDS=1200

# Local model directory, not a remote model identifier. A leading ~ is supported.
DIFFUSION_MODEL_PATH=~/models/Tongyi-MAI_Z-Image-Turbo
DIFFUSION_IMAGE_SIZE=1024x576
DIFFUSION_STEPS=5
DIFFUSION_GUIDANCE_SCALE=0
DIFFUSION_SEED=42

# The two current production renderers use Noto Sans Regular/Bold.
PPT_TITLE_FONT=Noto Sans
PPT_BODY_FONT=Noto Sans
PPT_CJK_FONT=Noto Sans CJK SC
